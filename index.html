<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puppet's Music Box Game</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin-top: 50px;
      overflow: hidden;
    }

    .music-box {
      width: 200px;
      height: 200px;
      border: 10px solid #aaa;
      border-radius: 50%;
      margin: 0 auto;
      background: radial-gradient(circle, #ccc 0%, #999 60%, #555 100%);
      box-shadow: inset 0 0 20px #000;
      position: relative;
    }

    .needle {
      width: 6px;
      height: 80px;
      background: red;
      position: absolute;
      top: 20px;
      left: 97px;
      transform-origin: bottom center;
      transform: rotate(0deg);
      transition: transform 0.2s linear;
    }

    .wind-up {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    .jumpscare-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }

    .puppet-jumpscare {
      width: 300px;
      transition: transform 0.5s ease;
    }

    .zoom-in {
      transform: scale(5);
    }

    .restart-button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      background: #fff;
      color: #000;
      border: none;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Puppet's Music Box</h1>
  <div class="music-box">
    <div class="needle" id="needle"></div>
  </div>
  <button class="wind-up" id="windButton">Wind Up</button>

  <!-- Jumpscare Screen -->
  <div class="jumpscare-screen" id="jumpscareScreen">
    <img src="https://i.imgur.com/YH9yPlX.png" alt="Puppet Jumpscare" class="puppet-jumpscare" id="puppetImage">
    <button class="restart-button" id="restartButton">Restart</button>
  </div>

  <!-- Music Box Sound -->
  <audio id="musicBoxAudio" loop>
    <source src="https://cdn.glitch.global/9c07ba68-f8a2-4ff7-a493-88ab772a6b60/FNAF2-Music-Box.mp3?v=1691400557749" type="audio/mpeg">
  </audio>

  <!-- Jumpscare Sound -->
  <audio id="jumpscareSound">
    <source src="https://cdn.glitch.global/4f9702e3-fb50-47e2-9f2f-7db3eddd3fb9/fnaf2_puppet_jumpscare.mp3?v=1691400757749" type="audio/mpeg">
  </audio>
