<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puppet's Music Box Game</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin-top: 50px;
      overflow: hidden;
    }

    .music-box {
      width: 200px;
      height: 200px;
      border: 10px solid #aaa;
      border-radius: 50%;
      margin: 0 auto;
      background: radial-gradient(circle, #ccc 0%, #999 60%, #555 100%);
      box-shadow: inset 0 0 20px #000;
      position: relative;
    }

    .needle {
      width: 6px;
      height: 80px;
      background: red;
      position: absolute;
      top: 20px;
      left: 97px;
      transform-origin: bottom center;
      transform: rotate(0deg);
      transition: transform 0.1s linear;
    }

    .wind-up {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    .jumpscare-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }

    .puppet-jumpscare {
      width: 300px;
      transition: transform 0.5s ease;
    }
