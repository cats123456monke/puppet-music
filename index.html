<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puppet's Music Box</title>

    body {
      background-color: #111;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin-top: 100px;
    }

    .music-box {
      width: 200px;
      height: 200px;
      border: 10px solid #aaa;
      border-radius: 50%;
      margin: 0 auto;
      background: radial-gradient(circle, #ccc 0%, #999 60%, #555 100%);
      box-shadow: inset 0 0 20px #000;
      position: relative;
    }

    .needle {
      width: 6px;
      height: 80px;
      background: red;
      position: absolute;
      top: 20px;
      left: 97px;
      transform-origin: bottom center;
      transform: rotate(0deg);
      transition: transform 0.2s linear;
    }

    .wind-up {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    .game-over {
      color: red;
      font-size: 30px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
